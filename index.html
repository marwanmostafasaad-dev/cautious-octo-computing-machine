<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>Hair &amp; More | Beauty Salon, 6th of October City</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,500&family=Figtree:wght@300;400;600&family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--plaster:#cfc6b8;--espresso:#1c1611;--glow:#f2c46b;--leather:#8a4a33;--terrazzo:#efeae2;--polish:#b3121c;--ink:#2a221b}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--espresso);color:var(--terrazzo);font:300 17px/1.7 'Figtree',sans-serif;overflow-x:hidden}
[dir=rtl] body{font-family:'Cairo',sans-serif}
h1,h2,h3,.serif{font-family:'Bodoni Moda',serif;font-weight:400;line-height:1.05}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .serif{font-family:'Cairo',serif;font-weight:700;line-height:1.3}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* cursor light */
#spot{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(420px circle at var(--x,50%) var(--y,30%),rgba(242,196,107,.13),transparent 70%)}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:20;padding:18px 0;transition:background .4s,padding .4s}
nav.s{background:rgba(28,22,17,.82);backdrop-filter:blur(14px);padding:10px 0}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:'Bodoni Moda',serif;font-style:italic;font-size:28px;letter-spacing:.5px}
.logo small{font-style:normal;font-family:'Figtree',sans-serif;font-size:11px;letter-spacing:.3em;color:var(--glow);display:block;margin-top:-4px}
.links{display:flex;gap:30px;font-size:15px}
.links a{opacity:.8;transition:opacity .2s,color .2s}.links a:hover{opacity:1;color:var(--glow)}
.btn{display:inline-block;padding:13px 28px;border-radius:99px;border:1px solid var(--glow);color:var(--glow);font-weight:600;font-size:15px;transition:.3s;cursor:pointer;background:none;font-family:inherit}
.btn:hover,.btn.fill{background:var(--glow);color:var(--espresso);box-shadow:0 0 36px rgba(242,196,107,.45)}
.btn.fill:hover{transform:translateY(-2px)}
.lang{padding:8px 16px;font-size:14px}
@media(max-width:760px){.links{display:none}}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden;background:radial-gradient(120% 80% at 70% 0%,#3a2f25,var(--espresso) 65%)}
.wave{position:absolute;left:-5%;width:110%;top:0;height:100%;pointer-events:none}
.wave path{fill:none;stroke-linecap:round}
.wave .core{stroke:var(--glow);stroke-width:2.2;stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 3.2s .3s cubic-bezier(.6,0,.2,1) forwards}
.wave .halo{stroke:var(--glow);stroke-width:14;opacity:.22;filter:blur(12px);stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 3.2s .3s cubic-bezier(.6,0,.2,1) forwards}
.wave .w2{stroke:var(--plaster);stroke-width:1;opacity:.25;stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 4s .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero .wrap{position:relative;z-index:2;padding-top:110px;padding-bottom:70px}
.hero h1{font-size:clamp(54px,11vw,158px);letter-spacing:-.02em}
.hero h1 span{display:block;opacity:0;transform:translateY(40px);animation:up 1.1s 2.2s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span:nth-child(2){font-style:italic;padding-inline-start:.9em;animation-delay:2.45s;color:var(--plaster)}
.hero h1 span:nth-child(3){animation-delay:2.7s}
[dir=rtl] .hero h1 span:nth-child(2){font-style:normal}
@keyframes up{to{opacity:1;transform:none}}
.hero p{max-width:430px;margin:34px 0 34px;opacity:0;animation:up 1s 3.1s forwards;color:#d9d0c2}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:up 1s 3.3s forwards}
.badge{position:absolute;z-index:2;right:6%;bottom:9%;width:132px;height:132px;opacity:0;animation:up 1s 3.5s forwards}
[dir=rtl] .badge{right:auto;left:6%}
.badge svg{width:100%;height:100%;animation:spin 22s linear infinite}
.badge b{position:absolute;inset:0;display:grid;place-items:center;font:italic 400 15px 'Bodoni Moda',serif;color:var(--glow);text-align:center;line-height:1.2}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.badge{display:none}}

/* marquee */
.marq{border-block:1px solid rgba(242,196,107,.25);overflow:hidden;white-space:nowrap;padding:20px 0;background:var(--espresso);position:relative;z-index:2}
.marq div{display:inline-flex;gap:48px;animation:mq 32s linear infinite;font:italic 400 30px 'Bodoni Moda',serif;color:var(--plaster)}
.marq i{color:var(--glow);font-style:normal}
[dir=rtl] .marq div{animation-direction:reverse;font-family:'Cairo'}
@keyframes mq{to{transform:translateX(-50%)}}

/* services */
section{position:relative;z-index:2}
.pad{padding:130px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap;margin-bottom:60px}
.head h2{font-size:clamp(40px,6vw,82px);max-width:9em}
.head p{max-width:340px;color:#bfb5a5}
.svc{border-top:1px solid rgba(207,198,184,.25)}
.row{display:grid;grid-template-columns:1.1fr 2fr auto;gap:30px;align-items:center;padding:34px 8px;border-bottom:1px solid rgba(207,198,184,.25);position:relative;transition:padding .45s cubic-bezier(.2,.8,.2,1),background .4s}
.row h3{font-size:clamp(28px,3.4vw,46px)}
.row p{color:#bfb5a5;max-width:480px}
.row em{font:italic 400 18px 'Bodoni Moda',serif;color:var(--glow);font-style:italic}
.row:hover{padding-inline:34px;background:linear-gradient(90deg,rgba(242,196,107,.12),transparent)}
[dir=rtl] .row:hover{background:linear-gradient(270deg,rgba(242,196,107,.12),transparent)}
.row:hover h3{color:var(--glow)}
@media(max-width:760px){.row{grid-template-columns:1fr;gap:8px}}

/* shade studio on terrazzo */
.terra{background-color:var(--terrazzo);color:var(--ink);background-image:
radial-gradient(circle at 12% 20%,#b9a48d 0 3px,transparent 4px),radial-gradient(circle at 78% 12%,#8a4a33 0 2.5px,transparent 3.5px),
radial-gradient(circle at 40% 70%,#1c1611 0 2px,transparent 3px),radial-gradient(circle at 90% 80%,#c9b69c 0 4px,transparent 5px),
radial-gradient(circle at 60% 40%,#d9c3a8 0 3px,transparent 4px),radial-gradient(circle at 25% 88%,#8c8173 0 2px,transparent 3px);
background-size:210px 210px,170px 170px,240px 240px,300px 300px,190px 190px,260px 260px}
.studio{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.terra h2{font-size:clamp(40px,5.5vw,74px)}
.terra p{margin-top:20px;max-width:420px;color:#4d4236}
.sw{display:flex;gap:14px;margin:34px 0 14px;flex-wrap:wrap}
.sw button{width:54px;height:54px;border-radius:50%;border:3px solid var(--terrazzo);background:var(--c);cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.sw button:hover{transform:scale(1.12) translateY(-3px)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink),0 8px 18px rgba(0,0,0,.25);transform:scale(1.1)}
#shade{font:italic 400 26px 'Bodoni Moda',serif}
[dir=rtl] #shade{font-family:'Cairo';font-style:normal;font-weight:700}
.hand{background:linear-gradient(160deg,#e3b99a,#c98f6a);border-radius:200px 200px 40px 40px;padding:50px 20px 0;box-shadow:0 40px 70px rgba(28,22,17,.3);max-width:380px;margin-inline:auto;position:relative;overflow:hidden;height:440px}
.hand svg{width:100%;display:block}
.nail{fill:var(--polish);transition:fill .6s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.nail.chrome{fill:url(#chr)}
.shine{fill:rgba(255,255,255,.55)}
.hand::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);animation:sh 5s 1s infinite}
@keyframes sh{to{transform:translateX(120%)}}
@media(max-width:820px){.studio{grid-template-columns:1fr;gap:40px}}

/* why */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.why div{padding:44px 34px;border-inline-start:1px solid rgba(207,198,184,.25)}
.why div:first-child{border:0;padding-inline-start:0}
.why h3{font-size:30px;margin-bottom:12px;color:var(--glow)}
.why p{color:#bfb5a5}
@media(max-width:820px){.why{grid-template-columns:1fr}.why div{border:0;border-top:1px solid rgba(207,198,184,.25);padding-inline:0}}

/* visit */
.visit{background:linear-gradient(180deg,var(--espresso),#2b2118);overflow:hidden}
.visit .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:60px;align-items:end}
.visit h2{font-size:clamp(46px,8vw,120px)}
.visit dl{display:grid;gap:22px}
.visit dt{font:italic 400 18px 'Bodoni Moda',serif;color:var(--glow)}
.visit dd{font-size:19px}
.big{font-size:clamp(26px,3vw,38px)!important;font-family:'Bodoni Moda',serif}
.open{display:inline-flex;align-items:center;gap:10px}
.open::before{content:"";width:10px;height:10px;border-radius:50%;background:#6fd08c;box-shadow:0 0 0 0 rgba(111,208,140,.7);animation:pl 2s infinite}
@keyframes pl{to{box-shadow:0 0 0 14px rgba(111,208,140,0)}}
@media(max-width:820px){.visit .grid{grid-template-columns:1fr}}
footer{padding:34px 0;text-align:center;font-size:14px;color:#8f8576;border-top:1px solid rgba(207,198,184,.15);position:relative;z-index:2}

.rv{opacity:0;transform:translateY(34px);transition:1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}.wave .core,.wave .halo,.wave .w2{stroke-dashoffset:0}.rv{opacity:1;transform:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
// i18n
const L={en:{},ar:{}};let lang='en';
function setLang(l){lang=l;const h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-en]').forEach(e=>e.innerHTML=e.dataset[l]);
 $('#lang').textContent=l==='ar'?'EN':'عربي';buildSw();}
$('#lang').onclick=()=>setLang(lang==='en'?'ar':'en');
// shades
const shades=[['#b3121c','Ruby red','أحمر ياقوتي'],['#e3c3a4','Soft nude','نيود ناعم'],['#a8708a','Dusty mauve','موف رمادي'],['#6b1b2b','Black cherry','كرزي داكن'],['chrome','Chrome mirror','كروم مرآة'],['#1c1611','Midnight','منتصف الليل']];
let cur=0;
function buildSw(){const s=$('#sw');s.innerHTML='';shades.forEach((c,i)=>{const b=document.createElement('button');
 b.style.setProperty('--c',c[0]==='chrome'?'linear-gradient(135deg,#f4f4f4,#7b8187 45%,#e8eaec 70%,#666c72)':c[0]);
 b.setAttribute('aria-label',c[1]);b.setAttribute('aria-pressed',i===cur);b.onclick=()=>{cur=i;apply()};s.appendChild(b)});apply(true)}
function apply(){const c=shades[cur];const n=$('#nails');
 n.querySelectorAll('.nail').forEach(e=>{e.classList.toggle('chrome',c[0]==='chrome');if(c[0]!=='chrome')e.style.setProperty('--polish',c[0])});
 if(c[0]!=='chrome')document.documentElement.style.setProperty('--polish',c[0]);
 $('#shade').textContent=lang==='ar'?c[2]:c[1];
 document.querySelectorAll('#sw button').forEach((b,i)=>b.setAttribute('aria-pressed',i===cur))}
// almond nails
(function(){const g=$('#nails');const xs=[[40,120,60],[95,70,64],[150,40,66],[205,72,62],[255,130,52]];
 xs.forEach(([x,y,w])=>{const h=190-y*.3,t=y+10;
  g.insertAdjacentHTML('beforeend',`<g><path class="nail" d="M${x-w/2} ${t+h} C${x-w/2} ${t+h*.35} ${x-w*.18} ${t} ${x} ${t} C${x+w*.18} ${t} ${x+w/2} ${t+h*.35} ${x+w/2} ${t+h} Z" transform="translate(0 ${60-y*.2})"/><ellipse class="shine" cx="${x-w*.15}" cy="${t+h*.45+60-y*.2}" rx="${w*.07}" ry="${h*.22}"/></g>`)});})();
setLang('en');
// scroll: nav, wave parallax, reveal
const nav=$('#nav'),wg=$('#waveG');
addEventListener('scroll',()=>{nav.classList.toggle('s',scrollY>40);wg.style.transform=`translateY(${scrollY*.25}px)`},{passive:true});
addEventListener('pointermove',e=>{const s=$('#spot').style;s.setProperty('--x',e.clientX+'px');s.setProperty('--y',e.clientY+'px')});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
</script>
